<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نوبت‌دهی ویزیت</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B3F7A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نوبت ویزیت">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --ink:#1B2338; --muted:#5E6A80; --line:#D5DBE5; --surface:#FFFFFF;
  --primary:#2B3F7A; --primary-ink:#FFFFFF; --accent:#E3A12F; --accent-ink:#1B2338;
  --ok:#2C7A57; --bad:#B03A2E;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10141F; --ink:#E7EAF2; --muted:#9AA5BC; --line:#2A3347; --surface:#181E2D;
    --primary:#7C94E6; --primary-ink:#0E1424; --accent:#F0B64A; --accent-ink:#10141F; --ok:#59C28F; --bad:#F0806F; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;line-height:1.7;font-size:16px}
header{background:var(--primary);color:var(--primary-ink);padding:14px 16px 0}
header h1{margin:0 0 10px;font-size:19px;font-weight:800}
.modes{display:flex;gap:4px}
.modes button{flex:1;border:0;background:transparent;color:inherit;opacity:.7;font:inherit;font-weight:600;padding:9px 6px;border-radius:10px 10px 0 0;cursor:pointer}
.modes button.on{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 6px}
.card h2{font-size:21px}
.card h3{font-size:17px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.codein{font-size:34px;text-align:center;letter-spacing:.35em;font-weight:800;padding:14px 8px;margin:14px 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:var(--primary);color:var(--primary-ink);cursor:pointer}
.btn.block{display:block;width:100%;margin-top:12px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 12px;font-size:14px;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:14px 0}
.slot{font:inherit;font-weight:600;padding:11px 0;border-radius:10px;border:1.5px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer}
.slot:active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot.off{border-color:var(--line);color:var(--muted);text-decoration:line-through;cursor:not-allowed;opacity:.6}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.day.past{opacity:.55}
.day .info{padding:14px}
.day .stub{border-inline-start:2px dashed var(--line);padding:14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.code{font-size:30px;font-weight:800;letter-spacing:.08em;line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;margin:6px 0 0 6px;font-size:14px}
.chip .x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.bk:first-of-type{border-top:0}
.note{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px;white-space:pre-line}
.plan{font-size:14px;color:var(--ink);margin-top:4px;white-space:pre-line}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.tabs button{font-size:14px;padding:9px 2px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nt{min-width:160px;white-space:pre-line}
.trow{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.trow label{margin:6px 0 2px;font-size:13px}
.trow input,.trow select{padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vstack{display:flex;flex-direction:column;gap:6px}
.lnk{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.tsum ul{margin:4px 0 10px;padding-inline-start:20px}
.tsum b{display:block;margin-top:8px;color:var(--primary)}
.stubbox{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;margin:8px 0}
.bk.dim{opacity:.55}
.st-active{border-color:var(--accent);font-weight:600}
.st-confirmed{border-color:var(--ok);color:var(--ok);font-weight:600}
.st-cancelled,.st-expired{color:var(--muted)}
.time{font-weight:800;color:var(--primary);min-width:56px}
.done{text-align:center}
.done .tick{width:54px;height:54px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;line-height:54px;margin:4px auto 10px}
.sum{text-align:right;background:var(--bg);border-radius:10px;padding:10px 14px;margin:12px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;z-index:9}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ---------- بخش سفارش‌ها ---------- */
main.wide{max-width:1100px}
.ord-root .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-template-columns:none}
.ord-root .fld{flex:1;min-width:120px}
.ord-root label{margin:8px 0 3px;font-size:13px}
.ord-root .btn{display:inline-block;width:auto;margin:0}
.ord-root .btn.block{display:block;width:100%;margin-top:12px}
.ord-root .btn.sec{background:var(--bg);color:var(--primary);border:1.5px solid var(--line)}
.ord-root .btn.red{background:var(--bad);color:#fff}
.ord-root .btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.ord-root .btn.sec.sm{background:transparent}
.ord-root .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ord-root .grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.ord-root .card h2{font-size:17px;color:var(--primary)}
.ord-root .hint{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.ord-root .hint.ok{color:var(--ok)}
.ord-root .chips{display:flex;gap:6px;flex-wrap:wrap}
.ord-root .chip{display:inline-block;margin:0;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:4px 13px;font:inherit;font-size:13px;cursor:pointer}
.ord-root .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ord-root .st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.ord-root .st.ok{background:#00B050;color:#fff}.ord-root .st.bad{background:#E53935;color:#fff}.ord-root .st.unk{background:#FFE600;color:#222}.ord-root .st.wait{background:var(--bg);color:var(--primary);border:1px solid var(--line)}
.ord-root .ord{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);border-right:8px solid var(--line)}
.ord-root .ord.ok{background:color-mix(in srgb,#00B050 24%,var(--surface));border-right-color:#00B050}
.ord-root .ord.bad{background:color-mix(in srgb,#E53935 22%,var(--surface));border-right-color:#E53935}
.ord-root .ord.unk{background:color-mix(in srgb,#FFE600 30%,var(--surface));border-right-color:#E6D600}
.ord-root .ord.dup{opacity:.6}
.ord-root .ord h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ord-root .ord .meta{font-size:13px;line-height:1.8;margin-top:4px}
.ord-root .amt{font-weight:800;font-size:16px}
.ord-root .tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:12px}
.ord-root .tag.warn{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.ord-root .mt{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:6px}
.ord-root .mt div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ord-root .mt small{display:block;color:var(--muted);font-size:12px}.ord-root .mt b{font-size:17px}
.ord-root .mt .okc{border-color:#00B050}.ord-root .mt .badc{border-color:#E53935}.ord-root .mt .unkc{border-color:#d9c700;background:color-mix(in srgb,#FFE600 20%,var(--surface))}
.ord-root .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;margin:6px 0}.ord-root .bar i{display:block;height:100%}
.ord-root table{min-width:0;white-space:nowrap}
.ord-root th{background:var(--primary);color:var(--primary-ink);position:sticky;top:0;text-align:center}
.ord-root td{text-align:center}
.ord-root tr.fri td{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.ord-root .scroll{overflow:auto;max-height:70vh;border-radius:8px;border:1px solid var(--line)}
.ord-root .muted{color:var(--muted)}
.ofab{position:fixed;left:14px;bottom:20px;z-index:25;width:58px;height:58px;border-radius:50%;background:var(--ok);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.omodal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.omodal .box{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:640px;padding:14px;margin:auto}
.omodal h2{margin:0 0 6px;color:var(--primary);font-size:18px}
.omodal .row{display:flex;flex-wrap:wrap;gap:8px;grid-template-columns:none}
.omodal .fld{flex:1;min-width:120px}
.omodal .btn{width:auto;margin:0}.omodal .btn.sec{background:var(--bg);color:var(--primary);border:1.5px solid var(--line)}
.omodal textarea{min-height:64px}
</style>
</head>
<body>
<header>
  <h1>نوبت‌دهی ویزیت</h1>
  <div class="modes">
    <button id="m-visitor" onclick="setMode('visitor')">ویزیتور</button>
    <button id="m-clerk" onclick="setMode('clerk')">مسئول سفارش</button>
    <button id="m-owner" onclick="setMode('owner')">مدیر</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script>
/* ---------- تنظیمات اتصال به Supabase ---------- */
const SB_URL = 'https://yndtbqwcslwcwossfcpo.supabase.co';
const SB_KEY = 'sb_publishable_o6wfsciJmqfwf0o1ZRLo2Q_fN-pdebf';
const SITE_URL = 'https://ofoghplus.github.io/Vizit/';
const SLOT = 30; // دقیقه

/* ---------- ابزارها ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faD = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const enD = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const toMin = t => { const p = String(t).split(':'); return +p[0] * 60 + +p[1]; };
const fromMin = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function nowMin(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function fmtDate(s){
  try{ return new Date(s + 'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian', {weekday:'long', year:'numeric', month:'long', day:'numeric'}); }
  catch(e){ return s; }
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2200);
}
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(() => toast('کپی شد'), () => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); toast('کپی شد'); }catch(e){ toast('کپی نشد'); }
  a.remove();
}
function slotsFrom(ranges){
  const s = new Set();
  ranges.forEach(r => { for(let m = toMin(r.from); m + SLOT <= toMin(r.to); m += SLOT) s.add(fromMin(m)); });
  return [...s].sort();
}
function normPhone(p){
  let d = enD(String(p == null ? '' : p)).replace(/\D/g, '');
  if(d.length === 12 && d.indexOf('98') === 0) d = '0' + d.slice(2);
  else if(d.length === 10 && d.charAt(0) === '9') d = '0' + d;
  return d;
}
const netMsg = e => (e && e.net) ? 'ارتباط با سرور برقرار نشد. اتصال اینترنت را بررسی کنید.' : 'خطای غیرمنتظره: ' + ((e && e.message) || '');

/* ---------- ارتباط با سرور ---------- */
const mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] || null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){ mem[k] = v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }

let session = null;
try{ session = JSON.parse(lsGet('sb_session') || 'null'); }catch(e){ session = null; }
function setSession(d){ session = {access_token:d.access_token, refresh_token:d.refresh_token}; lsSet('sb_session', JSON.stringify(session)); }
function clearSession(){ session = null; lsDel('sb_session'); }

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  try{
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})});
    if(!res.ok){ clearSession(); return false; }
    setSession(await res.json()); return true;
  }catch(e){ return false; }
}

async function sb(path, opt){
  opt = opt || {};
  const headers = {apikey: SB_KEY, 'Content-Type': 'application/json'};
  if(opt.auth && session) headers.Authorization = 'Bearer ' + session.access_token;
  if(opt.prefer) headers.Prefer = opt.prefer;
  let res;
  try{
    res = await fetch(SB_URL + path, {method: opt.method || 'GET', headers, body: opt.body === undefined ? undefined : JSON.stringify(opt.body)});
  }catch(e){ throw {net:true, message:'net'}; }
  if(res.status === 401 && opt.auth && !opt.retried && await refreshSession()) return sb(path, Object.assign({}, opt, {retried:true}));
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok) throw {status: res.status, message: (data && (data.message || data.msg || data.error_description)) || String(text || res.status)};
  return data;
}

/* ---------- متن دوره ویزیت ماهانه ---------- */
const DEFAULT_CYCLE = 'ویزیت‌ها به‌صورت دوره‌ای و ماهانه برگزار می‌شود: هر شرکت در هر ماه یک نوبت ویزیت دارد و نوبت‌ها به ترتیب روزهای تعیین‌شده تقسیم می‌شوند. لطفاً پیش از مراجعه، طرح فروش کالای خود را در فرم ثبت کنید تا در جلسه بررسی شود.';
let CYCLE = null; // null یعنی هنوز از سرور نیامده
const cycleNote = () => CYCLE === null ? DEFAULT_CYCLE : CYCLE;
const cycleInner = () => cycleNote().trim() ? `<div class="note"><b>دوره ویزیت ماهانه</b><br>${esc(cycleNote())}</div>` : '';
const cycleBox = () => `<div class="cyc">${cycleInner()}</div>`;
let GROUPS = [];
const parseGroups = v => String(v == null ? '' : v).split('\n').map(x => x.trim()).filter(Boolean);
const groupOpts = () => GROUPS.map(g => `<option value="${esc(g)}"></option>`).join('');
function applySettings(rows){
  (rows || []).forEach(r => {
    if(r.key === 'cycle_note') CYCLE = r.value;
    if(r.key === 'product_groups') GROUPS = parseGroups(r.value);
  });
  document.querySelectorAll('.cyc').forEach(e => e.innerHTML = cycleInner());
  document.querySelectorAll('.grp').forEach(e => e.innerHTML = groupOpts());
}
async function loadCycle(){
  try{ applySettings(await sb('/rest/v1/settings?select=key,value')); }catch(e){}
}

/* ---------- وضعیت رابط ---------- */
let O = {avail:[], codes:{}, bookings:[], visitors:[], invites:[], loaded:false};
let ui = {mode:'visitor', v:{step:'code'}, form:{}, edit:null, editB:null, editR:null, editTerms:false, lastInv:null, inv:{date:'', time:'', phone:'', name:'', hours:48}, q:'', gf:'', tab:'days', err:'', busy:false, loading:false, af:{date:todayStr(), from:'09:00', to:'12:00'}};
const errHtml = () => ui.err ? `<div class="err" role="alert">${esc(ui.err)}</div>` : '';
function setMode(m){
  ui.mode = m; ui.err = '';
  if(m === 'owner' && session && ORD.role() !== 'clerk' && ORD.role() !== 'inactive' && !O.loaded && !ui.loading) loadOwner(); else render();
}
function render(){
  $('#app').innerHTML = ui.mode === 'visitor' ? visitorView() : ui.mode === 'clerk' ? ORD.clerkView() : ownerView();
  $('#m-visitor').classList.toggle('on', ui.mode === 'visitor');
  $('#m-owner').classList.toggle('on', ui.mode === 'owner');
  $('#m-clerk').classList.toggle('on', ui.mode === 'clerk');
  ORD.bind();
  const f = $('#code'); if(f && ui.mode === 'visitor') f.focus();
}
const btn = (label, fn, cls) => `<button class="btn ${cls || 'block'}" ${ui.busy ? 'disabled' : ''} onclick="${fn}">${ui.busy ? 'لطفاً صبر کنید…' : label}</button>`;

/* ================= ویزیتور ================= */
function visitorView(){
  const v = ui.v, f = ui.form || {};
  if(v.step === 'code'){
    return `<section class="card">
      <h2>گرفتن نوبت ویزیت</h2>
      <p class="muted">کدی که برایتان پیامک شده را وارد کنید.</p>
      ${cycleBox()}
      <input id="code" class="codein" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="۰۰۰۰" aria-label="کد نوبت‌گیری" onkeydown="if(event.key==='Enter')checkCode()">
      ${btn('ادامه', 'checkCode()')}
      ${errHtml()}
    </section>`;
  }
  if(v.step === 'slots'){
    const d = v.data, all = slotsFrom(d.ranges || []), taken = d.taken || [], isToday = d.date === todayStr(), now = nowMin();
    const off = x => taken.includes(x) || (isToday && toMin(x) <= now);
    const free = all.filter(x => !off(x)).length;
    return `<section class="card">

function resetV(){ ui.v = {step:'code'}; ui.err = ''; ui.form = {}; render(); }
async function checkCode(){
  const c = enD($('#code').value.trim());
  if(!c){ ui.err = 'کد را وارد کنید.'; render(); return; }
  if(c.length >= 5){ ui.v = {step:'phone', code:c}; ui.err = ''; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{
    const d = await sb('/rest/v1/rpc/get_day_slots', {method:'POST', body:{p_code:c}});
    ui.busy = false;
    if(!d){ ui.err = 'این کد معتبر نیست یا زمان آن گذشته است.'; render(); $('#code').value = c; return; }
    ui.v = {step:'slots', code:c, data:d}; render();
  }catch(e){ ui.busy = false; ui.err = netMsg(e); render(); $('#code').value = c; }
}
async function refreshSlots(){
  const v = ui.v; ui.busy = true; render();
  try{
    const d = await sb('/rest/v1/rpc/get_day_slots', {method:'POST', body:{p_code:v.code}});
    ui.busy = false;
    if(!d){ ui.err = 'کد معتبر نیست یا زمان آن گذشته است.'; ui.v = {step:'code'}; render(); return; }
    ui.v = {step:'slots', code:v.code, data:d}; render();
  }catch(e){ ui.busy = false; ui.err = netMsg(e); render(); }
}
function pickSlot(t){ ui.v = Object.assign({}, ui.v, {step:'form', time:t}); ui.err = ''; render(); }
async function submitBooking(){
  const v = ui.v;
  ui.form = {name:$('#f-name').value.trim(), company:$('#f-company').value.trim(), phone:enD($('#f-phone').value.trim()), group:$('#f-group').value.trim(), plan:$('#f-plan').value.trim()};
  const f = ui.form;
  if(!f.name || !f.company || !f.phone || !f.group || !f.plan){ ui.err = 'نام، شرکت، شماره تماس، گروه کالایی و توضیحات طرح فروش را کامل وارد کنید.'; render(); return; }
  if(normPhone(f.phone).length < 10){ ui.err = 'شماره تماس معتبر نیست.'; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{
    const st = await sb('/rest/v1/rpc/phone_status', {method:'POST', body:{p_phone:f.phone}});
    ui.busy = false;
    if(st && st.terms_done){ await doBook(null); return; }
    TE = blankTerms(); ui.v = Object.assign({}, v, {step:'terms'}); render();
  }catch(e){ ui.busy = false; ui.err = netMsg(e); render(); }
}
function backToForm(){ ui.v = Object.assign({}, ui.v, {step:'form'}); ui.err = ''; render(); }
function submitTerms(){
  teSync(); const c = cleanTerms(TE), er = validateTerms(c, false);
  if(er){ ui.err = er; render(); return; }
  doBook(c);
}
async function doBook(terms){
  const v = ui.v, f = ui.form;
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/rpc/book_slot', {method:'POST', body:{p_code:v.code, p_time:v.time, p_name:f.name, p_company:f.company, p_phone:f.phone, p_plan:f.plan, p_group:f.group, p_terms:terms}});
    ui.busy = false;
    ui.v = {step:'done', booking:{date:v.data.date, time:v.time, name:f.name, company:f.company}}; ui.form = {}; render();
  }catch(e){
    ui.busy = false;
    const m = (e && e.message) || '';
    if(m.indexOf('taken') > -1 || m.indexOf('invalid_time') > -1){ await refreshSlots(); ui.err = 'این زمان همین الان رزرو شد. زمان دیگری انتخاب کنید.'; render(); return; }
    if(m.indexOf('invalid_phone') > -1){ ui.err = 'شماره تماس معتبر نیست.'; ui.v = Object.assign({}, v, {step:'form'}); render(); return; }
    if(m.indexOf('invalid_code') > -1){ ui.err = 'کد معتبر نیست یا زمان آن گذشته است.'; ui.v = {step:'code'}; render(); return; }
    if(m.indexOf('terms_required') > -1){ ui.err = 'لطفاً شرایط قرارداد را کامل کنید.'; ui.v = Object.assign({}, v, {step:'terms'}); render(); return; }
    ui.err = netMsg(e); render();
  }
}

/* ---------- ورود با دعوت‌نامه شخصی ---------- */
function invErr(e){
  const m = (e && e.message) || '';
  if(m.indexOf('invalid_invite') > -1) return 'کد دعوت‌نامه معتبر نیست.';
  if(m.indexOf('phone_mismatch') > -1) return 'این شماره با دعوت‌نامه مطابقت ندارد.';
  if(m.indexOf('invite_closed') > -1) return 'این دعوت‌نامه منقضی یا لغو شده است. با مدیر تماس بگیرید.';
  if(m.indexOf('taken') > -1) return 'این زمان دیگر در دسترس نیست. با مدیر تماس بگیرید.';
  if(m.indexOf('terms_required') > -1) return 'لطفاً شرایط قرارداد را کامل کنید.';
  if(m.indexOf('invalid_input') > -1) return 'نام و شرکت را وارد کنید.';
  return netMsg(e);
}
async function openInvite(){
  const code = ui.v.code, ph = normPhone($('#ph').value);
  if(ph.length < 10){ ui.err = 'شماره موبایل معتبر نیست.'; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{
    const d = await sb('/rest/v1/rpc/invite_open', {method:'POST', body:{p_code:code, p_phone:ph}});
    ui.busy = false;
    ui.form = {name:d.name || '', company:d.company || '', group:d.product_group || '', plan:''};
    TE = d.terms_done ? normTerms(d.terms) : blankTerms(); ui.editTerms = !d.terms_done;
    ui.v = {step:'inv', code, phone:ph, inv:d}; render();
  }catch(e){
    ui.busy = false; ui.err = invErr(e);
    if(String((e && e.message) || '').indexOf('invalid_invite') > -1){ ui.v = {step:'code'}; render(); return; }
    render();
  }
}
function syncInvFields(){
  const plan = $('#f-plan');
  ui.form = {name:$('#f-name').value.trim(), company:$('#f-company').value.trim(), group:$('#f-group').value.trim(), plan: plan ? plan.value.trim() : (ui.form.plan || '')};
}
function startEditTerms(){ syncInvFields(); ui.editTerms = true; TE = normTerms(ui.v.inv.terms); render(); }
async function submitInvite(){
  const v = ui.v, d = v.inv, conf = d.status === 'confirmed';
  syncInvFields(); const f = ui.form;
  if(!f.name || !f.company || !f.group || (!conf && !f.plan)){ ui.err = conf ? 'نام، شرکت و گروه کالایی را وارد کنید.' : 'نام، شرکت، گروه کالایی و توضیحات طرح فروش را وارد کنید.'; render(); return; }
  let terms = null;
  if(!d.terms_done || ui.editTerms){
    teSync(); terms = cleanTerms(TE);
    const er = validateTerms(terms, false);
    if(er){ ui.err = er; render(); return; }
  }
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/rpc/invite_confirm', {method:'POST', body:{p_code:v.code, p_phone:v.phone, p_name:f.name, p_company:f.company, p_group:f.group, p_plan:f.plan, p_terms:terms}});
    ui.busy = false;
    ui.v = {step:'done', edited:conf, booking:{date:d.date, time:d.time, name:f.name, company:f.company}}; ui.form = {}; render();
  }catch(e){ ui.busy = false; ui.err = invErr(e); render(); }
}

async function login(){
  const email = $('#em').value.trim(), pw = $('#pw').value;
  if(!email || !pw){ ui.err = 'ایمیل و رمز را وارد کنید.'; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'application/json'}, body: JSON.stringify({email, password:pw})});
    const d = await res.json();
    if(!res.ok) throw {bad:true};
    setSession(d); await ORD.afterLogin(); ui.busy = false; if(ORD.role() === 'clerk' || ORD.role() === 'inactive'){ render(); return; } await loadOwner();
  }catch(e){
    ui.busy = false;
    ui.err = (e && e.bad) ? 'ایمیل یا رمز اشتباه است.' : 'ارتباط با سرور برقرار نشد.';
    render();
  }
}
function logout(){ clearSession(); ORD.reset(); O = {avail:[], codes:{}, bookings:[], visitors:[], invites:[], loaded:false}; ui.edit = null; ui.editB = null; ui.editR = null; ui.err = ''; render(); }
function ownerErr(e){
  if(e && e.status === 401){ clearSession(); O.loaded = false; ui.err = 'نشست منقضی شد؛ دوباره وارد شوید.'; }
  else ui.err = netMsg(e);
}

const siteUrl = () => location.protocol.indexOf('http') === 0 ? location.href.split('#')[0].split('?')[0] : SITE_URL;
function dayMsg(d){
  return `کد نوبت‌گیری برای ${fmtDate(d)}: ${faD(O.codes[d] || '')}\nلطفاً کد را در صفحه نوبت‌دهی وارد کنید و زمان ویزیت را انتخاب کنید.\n${siteUrl()}`;
}
function smsDay(d){ location.href = 'sms:?&body=' + encodeURIComponent(dayMsg(d)); }
function copyDay(d){ copyText(dayMsg(d)); }

async function ensureCode(date){
  const used = new Set(Object.values(O.codes));
  for(let i = 0; i < 15; i++){
    const code = String(1000 + Math.floor(Math.random() * 9000));
    if(used.has(code)) continue;
    try{
      await sb('/rest/v1/day_codes', {method:'POST', auth:true, body:{date, code}, prefer:'return=minimal'});
      O.codes[date] = code; return;
    }catch(e){
      if(e && e.status === 409){
        used.add(code);
        const ex = await sb('/rest/v1/day_codes?date=eq.' + date + '&select=code', {auth:true});
        if(ex && ex.length){ O.codes[date] = ex[0].code; return; }
        continue;
      }
      throw e;
    }
  }
  throw {message:'ساخت کد ناموفق بود'};
}
async function addAvail(){
  const date = $('#a-date').value, from = $('#a-from').value, to = $('#a-to').value;
  ui.af = {date, from, to};
  if(!date || !from || !to){ ui.err = 'تاریخ و ساعت‌ها را کامل وارد کنید.'; render(); return; }
  if(date < todayStr()){ ui.err = 'تاریخ گذشته قابل انتخاب نیست.'; render(); return; }
  if(toMin(to) - toMin(from) < SLOT){ ui.err = 'بازه باید حداقل ' + faD(SLOT) + ' دقیقه باشد.'; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/avail', {method:'POST', auth:true, body:{date, from_time:from, to_time:to}, prefer:'return=minimal'});
    if(!O.codes[date]) await ensureCode(date);
    ui.busy = false; await loadOwner(); toast('اضافه شد');
  }catch(e){ ui.busy = false; ownerErr(e); render(); }
}
async function delRange(id){
  const r = O.avail.find(a => a.id === id); if(!r) return;
  const rest = O.avail.filter(a => a.id !== id && a.date === r.date).map(a => ({from:a.from_time, to:a.to_time}));
  const still = slotsFrom(rest);
  const orphan = O.bookings.filter(b => b.date === r.date && !still.includes(b.time));
  if(!confirm(orphan.length ? 'این بازه و ' + faD(orphan.length) + ' نوبت ثبت‌شده در آن حذف شود؟' : 'این بازه حذف شود؟')) return;
  try{

function blankTerms(){ return {settlement:[{type:'نقد', days:'', discount:''}], returns:{mode:'', percent:'', notes:''}, margins:[], extras:[], volumes:[], vip:{has:'', percent:''}}; }

function normTerms(t){

  const v = x => x == null ? '' : x, arr = a => Array.isArray(a) ? a : [], rt = t.returns || {}, vp = t.vip || {};
  return {
    settlement: arr(t.settlement).map(r => ({type:v(r.type), days:v(r.days), discount:v(r.discount)})),
    returns: {mode:v(rt.mode), percent:v(rt.percent), notes:v(rt.notes)},
    margins: arr(t.margins).map(r => ({scope:v(r.scope), percent:v(r.percent)})),
    extras: arr(t.extras).map(r => ({scope:v(r.scope), kind:r.kind === 'plan' ? 'plan' : 'percent', value:v(r.value)})),
    volumes: arr(t.volumes).map(r => ({scope:v(r.scope), condition:v(r.condition), kind:r.kind === 'amount' ? 'amount' : 'percent', value:v(r.value)})),
    vip: {has:v(vp.has), percent:v(vp.percent)}
  };
}

function teSync(){
  if(!TE) return;
  document.querySelectorAll('#tedit [data-k]').forEach(e => {
    const k = e.getAttribute('data-k'), f = e.getAttribute('data-f'), i = e.getAttribute('data-i');
    if(i === null || i === undefined){ if(TE[k]) TE[k][f] = e.value; }
    else if(TE[k] && TE[k][+i]) TE[k][+i][f] = e.value;
  });
}
function teRender(){ const d = $('#tedit'); if(d) d.innerHTML = teHtml(); }
function teAdd(k){ teSync(); TE[k].push(newRow(k)); teRender(); }
function teDel(k, i){ teSync(); TE[k].splice(+i, 1); teRender(); }
function teChange(){ teSync(); teRender(); }

function cleanTerms(t){
  const s = x => String(x == null ? '' : x).trim();
  return {
    settlement: t.settlement.map(r => ({type:s(r.type), days:num(r.days), discount:num(r.discount)})).filter(r => r.type || r.days !== null || r.discount !== null),
    returns: {mode:t.returns.mode, percent:t.returns.mode === 'percent' ? num(t.returns.percent) : null, notes:s(t.returns.notes)},
    margins: t.margins.map(r => ({scope:s(r.scope), percent:num(r.percent)})).filter(r => r.scope || r.percent !== null),
    extras: t.extras.map(r => ({scope:s(r.scope), kind:r.kind, value:r.kind === 'percent' ? num(r.value) : s(r.value)})).filter(r => r.scope || (r.value !== null && r.value !== '')),
    volumes: t.volumes.map(r => ({scope:s(r.scope), condition:s(r.condition), kind:r.kind, value:r.kind === 'percent' ? num(r.value) : s(r.value)})).filter(r => r.scope || r.condition || (r.value !== null && r.value !== '')),
    vip: {has:t.vip.has, percent:t.vip.has === 'yes' ? num(t.vip.percent) : null}
  };
}
function validateTerms(c, partial){
  const pct = x => x !== null && x >= 0 && x <= 100;
  if(!partial && !c.settlement.length) return 'حداقل یک روش تسویه وارد کنید.';
  for(const r of c.settlement){
    if(!r.type) return 'نوع روش تسویه را وارد کنید (مثلاً نقد یا چک).';
    if(r.days !== null && (r.days < 0 || r.days > 365)) return 'مدت تسویه باید بین ۰ تا ۳۶۵ روز باشد.';
    if(r.discount !== null && !pct(r.discount)) return 'درصد تخفیف تسویه باید بین ۰ تا ۱۰۰ باشد.';
  }
  if(!partial && !c.returns.mode) return 'شرایط مرجوعی را انتخاب کنید.';
  if(c.returns.mode === 'percent' && !pct(c.returns.percent)) return 'درصد مرجوعی را (۰ تا ۱۰۰) وارد کنید.';
  for(const r of c.margins){ if(!r.scope || !pct(r.percent)) return 'برای هر مارژین، کالا یا گروه و درصد (۰ تا ۱۰۰) را وارد کنید.'; }
  for(const r of c.extras){
    if(!r.scope || r.value === '' || r.value === null) return 'برای هر تخفیف مازاد، کالا یا گروه و مقدار را وارد کنید.';
    if(r.kind === 'percent' && !pct(r.value)) return 'درصد تخفیف مازاد باید بین ۰ تا ۱۰۰ باشد.';
  }
  for(const r of c.volumes){
    if(!r.scope || !r.condition || r.value === '' || r.value === null) return 'برای هر تخفیف حجمی، کالا یا گروه، شرط حجم و مقدار را وارد کنید.';
    if(r.kind === 'percent' && !pct(r.value)) return 'درصد تخفیف حجمی باید بین ۰ تا ۱۰۰ باشد.';
  }
  if(!partial && !c.vip.has) return 'وضعیت VIP افق پلاس را انتخاب کنید.';
  if(c.vip.has === 'yes' && !pct(c.vip.percent)) return 'درصد VIP را (۰ تا ۱۰۰) وارد کنید.';
  return '';
}
function termsSummary(t){
  t = t || {};
  const li = x => `<li>${x}</li>`, p = x => faD(x) + '٪', L = a => a.length ? '<ul>' + a.join('') + '</ul>' : '<div class="muted">—</div>';
  const set = (t.settlement || []).map(r => li(`${esc(r.type)}${r.days ? ' ' + faD(r.days) + ' روزه' : ''}${r.discount ? ' — ' + p(r.discount) + ' تخفیف' : ''}`));
  const rt = t.returns || {};
  const ret = rt.mode === 'full' ? '۱۰۰٪ مرجوعی' : rt.mode === 'percent' ? p(rt.percent) + ' از مصرف' : rt.mode === 'none' ? 'ندارد' : '—';
  const mar = (t.margins || []).map(r => li(`${esc(r.scope)}: ${p(r.percent)}`));
  const ext = (t.extras || []).map(r => li(`${esc(r.scope)}: ${r.kind === 'plan' ? 'طرح فروش ویژه — ' + esc(r.value) : p(r.value)}`));
  const vol = (t.volumes || []).map(r => li(`${esc(r.scope)} — ${esc(r.condition)}: ${r.kind === 'amount' ? esc(faD(r.value)) + ' (مبلغ)' : p(r.value)}`));
  const vp = t.vip || {};
  const vip = vp.has === 'yes' ? 'دارد' + (vp.percent != null ? ' — ' + p(vp.percent) : '') : vp.has === 'no' ? 'ندارد' : '—';
  return `<div class="tsum"><b>تسویه</b>${L(set)}<b>مرجوعی</b><div>${ret}${rt.notes ? ' — ' + esc(rt.notes) : ''}</div><b>مارژین پایه</b>${L(mar)}<b>تخفیف مازاد</b>${L(ext)}<b>تخفیف حجمی</b>${L(vol)}<b>VIP افق پلاس</b><div>${vip}</div></div>`;
}

/* ---------- دعوت‌نامه‌های شخصی (مدیر) ---------- */
const invState = i => i.status === 'confirmed' ? 'confirmed' : i.status === 'cancelled' ? 'cancelled' :
  (i.status === 'sent' && new Date(i.expires_at) > new Date()) ? 'active' : 'expired';
const INV_LABEL = {active:'در انتظار ثبت', confirmed:'ثبت شد', cancelled:'لغو شده', expired:'منقضی'};
function freeSlots(date){
  const taken = new Set(O.bookings.filter(b => b.date === date).map(b => b.time));
  O.invites.filter(i => i.date === date && invState(i) === 'active').forEach(i => taken.add(i.time));
  const isToday = date === todayStr(), now = nowMin();
  return slotsFrom(ownerRanges(date)).filter(x => !taken.has(x) && !(isToday && toMin(x) <= now));
}
function invMsg(i){
  return `سلام${i.name ? ' ' + i.name : ''}. نوبت ویزیت شما ${fmtDate(i.date)} ساعت ${faD(i.time)} نگه داشته شده است.\nکد شما: ${faD(i.code)}\nبرای تأیید، از لینک زیر با کد و شماره موبایل خود وارد شوید:\n${siteUrl()}`;
}

function decorate(){ // پرچم تکراری مانند اکسل
 const seen=new Set();const a=S.orders.slice().sort((x,y)=>(x.row_no||0)-(y.row_no||0));
 a.forEach(o=>{const k=[norm(o.company),norm(o.product),o.buy_date,o.ship_date,o.amount].join('|');o._dup=!!(o.company&&o.amount!=null&&seen.has(k));if(o.company&&o.amount!=null)seen.add(k);
  o._buy=keyStr(o.buy_date);o._ship=keyStr(o.ship_date)});
 S.cheques.forEach(c=>{c._key=keyStr(c.cheque_date)})}
function report(from,to){
 const inR=k=>k!=null&&k>=from&&k<=to;const os=S.orders.filter(o=>!o._dup);
 const R={cash:0,chq:0,regCount:0,regSum:0,shipped:0,days:0,over:0};STATUSES.forEach(s=>{R[s]={n:0,sum:0}});
 os.forEach(o=>{const a=o.amount||0;
  if(inR(o._buy)){if(o.settle_type==='نقد')R.cash+=a;if(a>0)R.regCount++;R.regSum+=a}
  if(inR(o._ship)&&o.company){R.shipped++;const s=R[o.status]?o.status:'نامشخص';R[s].n++;R[s].sum+=a}
  if(o._ship!=null&&o._ship<=to&&o.status==='در انتظار دریافت')R.over++});
 S.cheques.forEach(c=>{if(inR(c._key))R.chq+=c.amount||0});
 R.days=j2d(...Object.values(keyToObj(to)))-j2d(...Object.values(keyToObj(from)))+1;return R}
function dailyRows(from,to){const rows=[];const a=j2d(...Object.values(keyToObj(from))),b=j2d(...Object.values(keyToObj(to)));
 const m=new Map();const os=S.orders.filter(o=>!o._dup);
 const g=(k)=>{let r=m.get(k);if(!r){r={reg:0,ship:0,ok:0,bad:0,wait:0,unk:0,okSum:0,waitSum:0};m.set(k,r)}return r};
 os.forEach(o=>{if(o._buy!=null&&o._buy>=from&&o._buy<=to&&(o.amount||0)>0)g(o._buy).reg++;
  if(o._ship!=null&&o._ship>=from&&o._ship<=to&&o.company){const r=g(o._ship);r.ship++;if(o.status==='دریافت شده'){r.ok++;r.okSum+=o.amount||0}else if(o.status==='کنسل شده')r.bad++;else if(o.status==='در انتظار دریافت'){r.wait++;r.waitSum+=o.amount||0}else r.unk++}});
 for(let j=a;j<=b;j++){const d=d2j(j),k=keyOf(d);rows.push(Object.assign({k,d,wd:weekday(d)},m.get(k)||{reg:0,ship:0,ok:0,bad:0,wait:0,unk:0,okSum:0,waitSum:0}))}return rows}
function csv(rows,cols){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 return '\ufeff'+[cols.map(c=>q(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c[0]])).join(','))).join('\r\n')}
function download(name,text,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

let role=null, me=null, roleLoading=false, setupNeeded=false;
const isMgr=()=>role==='manager'||role==='legacy';
function jwtSub(){try{const p=session.access_token.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}}
const canEdit=o=>isMgr()||(!!o.created_by&&o.created_by===jwtSub());
async function loadMe(){
 if(!session){role=null;me=null;return}
 roleLoading=true;
 try{const a=await sb(`/rest/v1/ord_staff?id=eq.${jwtSub()}&select=*`,{auth:true});
  if(a&&a.length){me=a[0];role=a[0].active===false?'inactive':a[0].role;setupNeeded=false}
  else{me={name:'مدیر'};role='legacy';setupNeeded=true}}
 catch(e){if(e&&e.status===401){clearSession();role=null;me=null}else{me={name:'مدیر'};role='legacy';setupNeeded=true}}
 roleLoading=false}
async function createStaff(name,username,password){
 if(!/^[a-z0-9._-]{3,30}$/i.test(username))throw new Error('نام کاربری: حداقل ۳ حرف انگلیسی/عدد (بدون فاصله)');
 if(password.length<6)throw new Error('رمز عبور حداقل ۶ کاراکتر باشد');
 let d;try{d=await sb('/auth/v1/signup',{method:'POST',body:{email:username.toLowerCase()+MAILD,password,data:{name}}})}catch(e){throw new Error(e.message||'ساخت کاربر ناموفق')}
 const id=(d&&d.user&&d.user.id)||(d&&d.id);if(!id)throw new Error('شناسه کاربر دریافت نشد؛ در Supabase گزینه Confirm email را خاموش کنید.');
 await sb('/rest/v1/ord_staff',{method:'POST',auth:true,body:{id,name,username:username.toLowerCase(),role:'clerk',active:true},prefer:'return=minimal'})}
async function changePassword(pw){if(pw.length<6)throw new Error('رمز عبور حداقل ۶ کاراکتر باشد');await sb('/auth/v1/user',{method:'PUT',auth:true,body:{password:pw}})}

 else{const [o,c]=await Promise.all([DB.all('ord_orders'),DB.all('ord_company_lookup')]);S.orders=o;S.companies=c;S.cheques=[];S.staff=[]}

 <div><small>در انتظار دریافت</small><b>${fa(st('در انتظار دریافت').n)}</b><small>${fa(st('در انتظار دریافت').sum)}</small></div>

 const d=parseDate(S.day),a=parseDate(S.rf),b=parseDate(S.rt);
 let h='';
 h+=`<div class="grid2"><div class="card"><h2>گزارش روزانه</h2><div class="row"><div class="fld">${'<label>تاریخ (سال/ماه/روز)</label>'}<input id="dDay" value="${esc(S.day)}" inputmode="numeric"></div><button class="btn sec sm" id="dToday">امروز</button></div>

 // معوق

 const k14=keyOf(d2j(j2d(t.y,t.m,t.d)+14)),due=S.cheques.filter(c=>c._key!=null&&c._key>=tk&&c._key<=k14).sort((x,y)=>x._key-y._key);
 h+=`<div class="card"><h2>چک‌های سررسید تا ۱۴ روز آینده — ${fa(due.length)}</h2>${due.length?due.slice(0,12).map(c=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0"><span>${esc(c.payee||c.company||'')}</span><span class="muted">${showD(c.cheque_date)}</span><b>${fa(c.amount)}</b></div>`).join(''):'<div class="muted">چکی در این بازه نیست</div>'}</div></div>`;

 return h}
function statusBar(R){const tot=STATUSES.reduce((s,k)=>s+R[k].n,0)||1;const col={'دریافت شده':'#00B050','کنسل شده':'#FF0000','در انتظار دریافت':'#9fb4cf','نامشخص':'#FFE600'};

function orderFilter(){const f=S.f,q=norm(f.q);const fa_=parseDate(f.from),ta=parseDate(f.to);
 return S.orders.filter(o=>{
  if(f.st&&o.status!==f.st)return false;if(f.visitor&&(o.visitor||'')!==f.visitor)return false;
  if(q&&!norm([o.company,o.product,o.visitor,o.phone,o.notes,o.row_no,o.settle_terms].join(' ')).includes(q))return false;
  const k=f.by==='buy'?o._buy:o._ship;if(fa_&&(k==null||k<keyOf(fa_)))return false;if(ta&&(k==null||k>keyOf(ta)))return false;return true})
 .sort((x,y)=>(y.row_no||0)-(x.row_no||0))}
function orderCard(o){
 const cls=SCLS[o.status]||'unk';const tel=o.phone?`<a href="tel:${esc(toEn(o.phone))}">📞 ${esc(o.visitor||'')} ${faTxt(o.phone)}</a>`:(o.visitor?esc(o.visitor):'<span class="muted">ویزیتور ثبت نشده</span>');

  if(rec.amount==null)return note('مبلغ را وارد کنید');if(!isNew)rec.id=c.id;
  try{await DB.save('ord_cheques',rec);m.close();note('ذخیره شد ✓');await reload()}catch(x){note('خطا: '+err(x),5000)}}}

function viewUsers(){return `<div class="card"><h2>مسئولان سفارش</h2><p class="muted">مسئول سفارش فقط می‌تواند سفارش ثبت کند، سفارش‌های خودش را ویرایش کند و بقیه سفارش‌ها را ببیند. به شرکت‌ها، چک‌ها، داشبورد و تنظیمات دسترسی ندارد.</p>
 <form id="uf" autocomplete="off"><div class="row">${input('u_name','نام و نام خانوادگی')}${input('u_user','نام کاربری (انگلیسی)','','dir="ltr"')}${input('u_pass','رمز عبور','','dir="ltr"')}</div>
 <div class="row" style="margin-top:10px"><button class="btn" id="u_add">＋ ساخت مسئول جدید</button></div></form></div>
 <div class="card"><h2>فهرست کاربران</h2>${S.staff.map(u=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0" data-id="${esc(u.id)}"><span><b>${esc(u.name)}</b> <span class="muted" dir="ltr">${esc(u.username||'')}</span> <span class="tag">${u.role==='manager'?'مدیر':'مسئول سفارش'}</span> ${u.active===false?'<span class="tag warn">غیرفعال</span>':''}<br><span class="hint">${fa(S.orders.filter(o=>o.created_by&&o.created_by===u.id).length)} سفارش ثبت کرده</span></span>
 ${u.role==='manager'?'':`<span class="row"><button class="btn sec sm" data-a="tg">${u.active===false?'فعال‌سازی':'غیرفعال'}</button><button class="btn red sm" data-a="rm">حذف</button></span>`}</div>`).join('')}</div>`}
function bindUsers(){
 $('#uf').onsubmit=async e=>{e.preventDefault();$('#u_add').disabled=true;try{await createStaff($('#u_name').value.trim()||$('#u_user').value.trim(),$('#u_user').value.trim(),$('#u_pass').value);note('مسئول ساخته شد ✓ نام کاربری و رمز را به او بدهید');await reload()}catch(x){note(err(x),6000);$('#u_add').disabled=false}};
 $$('[data-id]').forEach(el=>{const u=S.staff.find(x=>String(x.id)===el.dataset.id);$$('button',el).forEach(b=>b.onclick=async()=>{try{
  if(b.dataset.a==='tg'){await DB.save('ord_staff',{id:u.id,active:u.active===false});note('انجام شد')}
  else if(confirm('این کاربر حذف شود؟ (سفارش‌های ثبت‌شده‌اش می‌مانند)')){await DB.del('ord_staff',u.id);note('حذف شد')}
  await reload()}catch(x){note(err(x),5000)}})})}
function viewAcct(){return `<div class="card"><h2>حساب من</h2><p>${esc(me.name)} — مسئول سفارش</p>
 <form id="pf"><label>رمز عبور جدید</label><input id="a_pw" type="password" dir="ltr" autocomplete="new-password"><div class="row" style="margin-top:10px"><button class="btn" id="a_ch">تغییر رمز</button><button type="button" class="btn red" id="a_out">خروج</button></div></form></div>`}
function bindAcct(){
 $('#pf').onsubmit=async e=>{e.preventDefault();try{await changePassword($('#a_pw').value);$('#a_pw').value='';note('رمز تغییر کرد ✓')}catch(x){note(err(x),5000)}};
 $('#a_out').onclick=()=>window.logout()}

/* ---------- ابزار (مدیر) ---------- */
function viewMore(){return `<div class="card"><h2>خروجی و پشتیبان</h2><div class="row"><button class="btn ghost small" id="m_xo">سفارش‌ها (CSV)</button><button class="btn ghost small" id="m_xc">شرکت‌ها (CSV)</button><button class="btn ghost small" id="m_xk">چک‌ها (CSV)</button><button class="btn small" id="m_bk">پشتیبان کامل (JSON)</button></div>
 <div class="fld" style="margin-top:10px"><label>بازیابی از فایل پشتیبان (داده‌های فعلی جایگزین می‌شود)</label><input type="file" id="m_rs" accept=".json"></div></div>
 <div class="card"><h2>داده‌های اکسل</h2><p class="muted">شرکت‌ها (${fa(SEED.ord_companies.length)})، چک‌ها (${fa(SEED.ord_cheques.length)}) و سفارش‌ها (${fa(SEED.ord_orders.length)}) از فایل اکسل شما آماده‌ی ورود به پایگاه داده است. فقط یک بار انجام دهید.</p>
 <button class="btn" id="m_seed">ارسال داده‌های اکسل به پایگاه داده</button></div>`}
function bindMore(){
 $('#m_xo').onclick=()=>exportOrders(S.orders);$('#m_xc').onclick=()=>download('companies.csv',csv(S.companies,COMP_F));$('#m_xk').onclick=()=>download('cheques.csv',csv(S.cheques,[['row_no','ردیف']].concat(CHQ_F)));
 $('#m_bk').onclick=()=>download('backup-'+fmtD(todayJ()).replace(/\//g,'-')+'.json',JSON.stringify({ord_orders:S.orders,ord_companies:S.companies,ord_cheques:S.cheques}),'application/json');
 $('#m_rs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!confirm('داده‌های فعلی حذف و با فایل پشتیبان جایگزین شود؟'))return;
  for(const t of DATA_TABLES){if(!Array.isArray(j[t]))continue;await DB.clear(t);await DB.bulk(t,j[t].map(x=>{x=Object.assign({},x);delete x.id;return x}))}note('بازیابی شد ✓');reload()}catch(x){note('فایل نامعتبر: '+err(x))}};
 $('#m_seed').onclick=async()=>{if(!confirm('داده‌های اکسل به پایگاه داده اضافه شود؟ (اگر قبلاً اضافه کرده‌اید، تکراری می‌شود)'))return;
  try{for(const t of DATA_TABLES){await DB.bulk(t,SEED[t])}note('انجام شد ✓');reload()}catch(x){note('خطا: '+err(x))}}}

return {role:()=>role,managerView,clerkView,clerkLogin,bind,reset,go,boot,retry,newOrder:()=>openOrder(),afterLogin:async()=>{role=null;S.loaded=false;S.failed=null;await loadMe()}};
})();

render();
loadCycle();
ORD.boot();
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>

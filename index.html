<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نوبت‌دهی ویزیت</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B3F7A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نوبت ویزیت">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --ink:#1B2338; --muted:#5E6A80; --line:#D5DBE5; --surface:#FFFFFF;
  --primary:#2B3F7A; --primary-ink:#FFFFFF; --accent:#E3A12F; --accent-ink:#1B2338;
  --ok:#2C7A57; --bad:#B03A2E;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10141F; --ink:#E7EAF2; --muted:#9AA5BC; --line:#2A3347; --surface:#181E2D;
    --primary:#7C94E6; --primary-ink:#0E1424; --accent:#F0B64A; --accent-ink:#10141F; --ok:#59C28F; --bad:#F0806F; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;line-height:1.7;font-size:16px}
header{background:var(--primary);color:var(--primary-ink);padding:14px 16px 0}
header h1{margin:0 0 10px;font-size:19px;font-weight:800}
.modes{display:flex;gap:4px}
.modes button{flex:1;border:0;background:transparent;color:inherit;opacity:.7;font:inherit;font-weight:600;padding:9px 6px;border-radius:10px 10px 0 0;cursor:pointer}
.modes button.on{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 6px}
.card h2{font-size:21px}
.card h3{font-size:17px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.codein{font-size:34px;text-align:center;letter-spacing:.35em;font-weight:800;padding:14px 8px;margin:14px 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:var(--primary);color:var(--primary-ink);cursor:pointer}
.btn.block{display:block;width:100%;margin-top:12px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 12px;font-size:14px;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:14px 0}
.slot{font:inherit;font-weight:600;padding:11px 0;border-radius:10px;border:1.5px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer}
.slot:active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot.off{border-color:var(--line);color:var(--muted);text-decoration:line-through;cursor:not-allowed;opacity:.6}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.day.past{opacity:.55}
.day .info{padding:14px}
.day .stub{border-inline-start:2px dashed var(--line);padding:14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.code{font-size:30px;font-weight:800;letter-spacing:.08em;line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;margin:6px 0 0 6px;font-size:14px}
.chip .x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.bk:first-of-type{border-top:0}
.note{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px;white-space:pre-line}
.plan{font-size:14px;color:var(--ink);margin-top:4px;white-space:pre-line}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.tabs button{font-size:14px;padding:9px 2px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nt{min-width:160px;white-space:pre-line}
.trow{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.trow label{margin:6px 0 2px;font-size:13px}
.trow input,.trow select{padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vstack{display:flex;flex-direction:column;gap:6px}
.lnk{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.tsum ul{margin:4px 0 10px;padding-inline-start:20px}
.tsum b{display:block;margin-top:8px;color:var(--primary)}
.stubbox{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;margin:8px 0}
.bk.dim{opacity:.55}
.st-active{border-color:var(--accent);font-weight:600}
.st-confirmed{border-color:var(--ok);color:var(--ok);font-weight:600}
.st-cancelled,.st-expired{color:var(--muted)}
.time{font-weight:800;color:var(--primary);min-width:56px}
.done{text-align:center}
.done .tick{width:54px;height:54px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;line-height:54px;margin:4px auto 10px}
.sum{text-align:right;background:var(--bg);border-radius:10px;padding:10px 14px;margin:12px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;z-index:9}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>نوبت‌دهی ویزیت</h1>
  <div class="modes">
    <button id="m-visitor" onclick="setMode('visitor')">ویزیتور</button>
    <button id="m-owner" onclick="setMode('owner')">مدیر</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script>
/* ---------- تنظیمات اتصال به Supabase ---------- */
const SB_URL = 'https://yndtbqwcslwcwossfcpo.supabase.co';
const SB_KEY = 'sb_publishable_o6wfsciJmqfwf0o1ZRLo2Q_fN-pdebf';
const SITE_URL = 'https://ofoghplus.github.io/Vizit/';
const SLOT = 30; // دقیقه

/* ---------- ابزارها ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faD = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const enD = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const toMin = t => { const p = String(t).split(':'); return +p[0] * 60 + +p[1]; };
const fromMin = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function nowMin(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function fmtDate(s){
  try{ return new Date(s + 'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian', {weekday:'long', year:'numeric', month:'long', day:'numeric'}); }
  catch(e){ return s; }
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2200);
}
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(() => toast('کپی شد'), () => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); toast('کپی شد'); }catch(e){ toast('کپی نشد'); }
  a.remove();
}
function slotsFrom(ranges){
  const s = new Set();
  ranges.forEach(r => { for(let m = toMin(r.from); m + SLOT <= toMin(r.to); m += SLOT) s.add(fromMin(m)); });
  return [...s].sort();
}
function normPhone(p){
  let d = enD(String(p == null ? '' : p)).replace(/\D/g, '');
  if(d.length === 12 && d.indexOf('98') === 0) d = '0' + d.slice(2);
  else if(d.length === 10 && d.charAt(0) === '9') d = '0' + d;
  return d;
}
const netMsg = e => (e && e.net) ? 'ارتباط با سرور برقرار نشد. اتصال اینترنت را بررسی کنید.' : 'خطای غیرمنتظره: ' + ((e && e.message) || '');

/* ---------- ارتباط با سرور ---------- */
const mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] || null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){ mem[k] = v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }

let session = null;
try{ session = JSON.parse(lsGet('sb_session') || 'null'); }catch(e){ session = null; }
function setSession(d){ session = {access_token:d.access_token, refresh_token:d.refresh_token}; lsSet('sb_session', JSON.stringify(session)); }
function clearSession(){ session = null; lsDel('sb_session'); }

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  try{
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})});
    if(!res.ok){ clearSession(); return false; }
    setSession(await res.json()); return true;
  }catch(e){ return false; }
}

async function sb(path, opt){
  opt = opt || {};
  const headers = {apikey: SB_KEY, 'Content-Type': 'application/json'};
  if(opt.auth && session) headers.Authorization = 'Bearer ' + session.access_token;
  if(opt.prefer) headers.Prefer = opt.prefer;
  let res;
  try{
    res = await fetch(SB_URL + path, {method: opt.method || 'GET', headers, body: opt.body === undefined ? undefined : JSON.stringify(opt.body)});
  }catch(e){ throw {net:true, message:'net'}; }
  if(res.status === 401 && opt.auth && !opt.retried && await refreshSession()) return sb(path, Object.assign({}, opt, {retried:true}));
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok) throw {status: res.status, message: (data && (data.message || data.msg || data.error_description)) || String(text || res.status)};
  return data;
}

/* ---------- متن دوره ویزیت ماهانه ---------- */
const DEFAULT_CYCLE = 'ویزیت‌ها به‌صورت دوره‌ای و ماهانه برگزار می‌شود: هر شرکت در هر ماه یک نوبت ویزیت دارد و نوبت‌ها به ترتیب روزهای تعیین‌شده تقسیم می‌شوند. لطفاً پیش از مراجعه، طرح فروش کالای خود را در فرم ثبت کنید تا در جلسه بررسی شود.';
let CYCLE = null; // null یعنی هنوز از سرور نیامده
const cycleNote = () => CYCLE === null ? DEFAULT_CYCLE : CYCLE;
const cycleInner = () => cycleNote().trim() ? `<div class="note"><b>دوره ویزیت ماهانه</b><br>${esc(cycleNote())}</div>` : '';
const cycleBox = () => `<div class="cyc">${cycleInner()}</div>`;
let GROUPS = [];
const parseGroups = v => String(v == null ? '' : v).split('\n').map(x => x.trim()).filter(Boolean);
const groupOpts = () => GROUPS.map(g => `<option value="${esc(g)}"></option>`).join('');
function applySettings(rows){
  (rows || []).forEach(r => {
    if(r.key === 'cycle_note') CYCLE = r.value;
    if(r.key === 'product_groups') GROUPS = parseGroups(r.value);
  });
  document.querySelectorAll('.cyc').forEach(e => e.innerHTML = cycleInner());
  document.querySelectorAll('.grp').forEach(e => e.innerHTML = groupOpts());
}
async function loadCycle(){
  try{ applySettings(await sb('/rest/v1/settings?select=key,value')); }catch(e){}
}

/* ---------- وضعیت رابط ---------- */
let O = {avail:[], codes:{}, bookings:[], visitors:[], invites:[], loaded:false};
let ui = {mode:'visitor', v:{step:'code'}, form:{}, edit:null, editB:null, editR:null, editTerms:false, lastInv:null, inv:{date:'', time:'', phone:'', name:'', hours:48}, q:'', gf:'', tab:'days', err:'', busy:false, loading:false, af:{date:todayStr(), from:'09:00', to:'12:00'}};
const errHtml = () => ui.err ? `<div class="err" role="alert">${esc(ui.err)}</div>` : '';
function setMode(m){
  ui.mode = m; ui.err = '';
  if(m === 'owner' && session && !O.loaded && !ui.loading) loadOwner(); else render();
}
function render(){
  $('#app').innerHTML = ui.mode === 'visitor' ? visitorView() : ownerView();
  $('#m-visitor').classList.toggle('on', ui.mode === 'visitor');
  $('#m-owner').classList.toggle('on', ui.mode === 'owner');
  const f = $('#code'); if(f && ui.mode === 'visitor') f.focus();
}
const btn = (label, fn, cls) => `<button class="btn ${cls || 'block'}" ${ui.busy ? 'disabled' : ''} onclick="${fn}">${ui.busy ? 'لطفاً صبر کنید…' : label}</button>`;

/* ================= ویزیتور ================= */
function visitorView(){
  const v = ui.v, f = ui.form || {};
  if(v.step === 'code'){
    return `<section class="card">
      <h2>گرفتن نوبت ویزیت</h2>
      <p class="muted">کدی که برایتان پیامک شده را وارد کنید.</p>
      ${cycleBox()}
      <input id="code" class="codein" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="۰۰۰۰" aria-label="کد نوبت‌گیری" onkeydown="if(event.key==='Enter')checkCode()">
      ${btn('ادامه', 'checkCode()')}
      ${errHtml()}
    </section>`;
  }
  if(v.step === 'slots'){
    const d = v.data, all = slotsFrom(d.ranges || []), taken = d.taken || [], isToday = d.date === todayStr(), now = nowMin();
    const off = x => taken.includes(x) || (isToday && toMin(x) <= now);
    const free = all.filter(x => !off(x)).length;
    return `<section class="card">
      <h2>${esc(fmtDate(d.date))}</h2>
      <p class="muted">${free ? 'یک زمان خالی انتخاب کنید (هر نوبت ' + faD(SLOT) + ' دقیقه).' : 'همه زمان‌های این روز پر شده است.'}</p>
      <div class="slots">${all.map(x => `<button class="slot ${off(x) ? 'off' : ''}" ${off(x) ? 'disabled' : ''} onclick="pickSlot('${x}')">${faD(x)}</button>`).join('')}</div>
      ${errHtml()}
      <button class="btn ghost" onclick="resetV()">بازگشت</button>
    </section>`;
  }
  if(v.step === 'form'){
    return `<section class="card">
      <h2>ثبت مشخصات</h2>
      <p class="muted">${esc(fmtDate(v.data.date))}، ساعت ${faD(v.time)}</p>
      <label for="f-name">نام و نام خانوادگی</label>
      <input id="f-name" autocomplete="name" value="${esc(f.name)}">
      <label for="f-company">نام شرکت</label>
      <input id="f-company" autocomplete="organization" value="${esc(f.company)}">
      <label for="f-phone">شماره تماس</label>
      <input id="f-phone" inputmode="tel" autocomplete="tel" value="${esc(f.phone)}">
      <label for="f-group">گروه کالایی</label>
      <input id="f-group" list="grp" autocomplete="off" value="${esc(f.group)}" placeholder="مثلاً لبنیات، بهداشتی، خشکبار">
      <datalist id="grp" class="grp">${groupOpts()}</datalist>
      <label for="f-plan">توضیحات طرح فروش کالا</label>
      <textarea id="f-plan" rows="5" placeholder="کالا یا خدمات، شرایط فروش، تخفیف‌ها و هر نکته‌ای که لازم است قبل از جلسه بدانیم">${esc(f.plan)}</textarea>
      ${cycleBox()}
      ${errHtml()}
      ${btn('ادامه', 'submitBooking()')}
      <button class="btn ghost block" ${ui.busy ? 'disabled' : ''} onclick="refreshSlots()">تغییر زمان</button>
    </section>`;
  }
  if(v.step === 'phone'){
    return `<section class="card"><h2>تأیید شماره موبایل</h2>
      <p class="muted">شماره‌ای که دعوت‌نامه برای آن ارسال شده را وارد کنید.</p>
      <input id="ph" class="codein" style="font-size:26px;letter-spacing:.08em" inputmode="tel" autocomplete="tel" placeholder="۰۹۱۲…" aria-label="شماره موبایل" onkeydown="if(event.key==='Enter')openInvite()">
      ${btn('ادامه', 'openInvite()')}${errHtml()}
      <button class="btn ghost block" onclick="resetV()">بازگشت</button></section>`;
  }
  if(v.step === 'inv'){
    const d = v.inv, conf = d.status === 'confirmed';
    return `<section class="card">
      <h2>${esc(fmtDate(d.date))}</h2>
      <p><b>ساعت ${faD(d.time)}</b> ${conf ? '<span class="chip">ثبت‌شده</span>' : ''}</p>
      <p class="muted">${conf ? 'نوبت شما ثبت شده است؛ در صورت نیاز اطلاعات و قرارداد را ویرایش کنید.' : 'این زمان برای شما نگه داشته شده است. اطلاعات را تکمیل و تأیید کنید.'}</p>
      <label for="f-name">نام و نام خانوادگی</label><input id="f-name" autocomplete="name" value="${esc(f.name)}">
      <label for="f-company">نام شرکت</label><input id="f-company" autocomplete="organization" value="${esc(f.company)}">
      <label for="f-group">گروه کالایی</label><input id="f-group" list="grp" autocomplete="off" value="${esc(f.group)}">
      <datalist id="grp" class="grp">${groupOpts()}</datalist>
      ${conf ? '' : `<label for="f-plan">توضیحات طرح فروش کالا</label><textarea id="f-plan" rows="4">${esc(f.plan)}</textarea>`}
      <h3 style="margin-top:18px">قرارداد و شرایط همکاری</h3>
      ${d.terms_done && !ui.editTerms
        ? `${termsSummary(d.terms)}<button class="btn small ghost" onclick="startEditTerms()">ویرایش قرارداد</button>`
        : `<div id="tedit">${teHtml()}</div>`}
      ${cycleBox()}${errHtml()}
      ${btn(conf ? 'ذخیره تغییرات' : 'تأیید و ثبت نوبت', 'submitInvite()')}
    </section>`;
  }
  if(v.step === 'terms'){
    return `<section class="card"><h2>قرارداد و شرایط همکاری</h2>
      <p class="muted">برای ثبت اولین نوبت، شرایط همکاری را تکمیل کنید. دفعات بعد نیازی به وارد کردن مجدد نیست.</p>
      <div id="tedit">${teHtml()}</div>${errHtml()}
      ${btn('ثبت نوبت', 'submitTerms()')}
      <button class="btn ghost block" ${ui.busy ? 'disabled' : ''} onclick="backToForm()">بازگشت</button></section>`;
  }
  if(v.step === 'done'){
    const b = v.booking;
    return `<section class="card done">
      <div class="tick" aria-hidden="true">✓</div>
      <h2>${v.edited ? 'تغییرات ذخیره شد' : 'نوبت شما ثبت شد'}</h2>
      <div class="sum">

    await sb('/rest/v1/rpc/book_slot', {method:'POST', body:{p_code:v.code, p_time:v.time, p_name:f.name, p_company:f.company, p_phone:f.phone, p_plan:f.plan, p_group:f.group, p_terms:terms}});

function invErr(e){
  const m = (e && e.message) || '';
  if(m.indexOf('invalid_invite') > -1) return 'کد دعوت‌نامه معتبر نیست.';
  if(m.indexOf('phone_mismatch') > -1) return 'این شماره با دعوت‌نامه مطابقت ندارد.';
  if(m.indexOf('invite_closed') > -1) return 'این دعوت‌نامه منقضی یا لغو شده است. با مدیر تماس بگیرید.';
  if(m.indexOf('taken') > -1) return 'این زمان دیگر در دسترس نیست. با مدیر تماس بگیرید.';
  if(m.indexOf('terms_required') > -1) return 'لطفاً شرایط قرارداد را کامل کنید.';
  if(m.indexOf('invalid_input') > -1) return 'نام و شرکت را وارد کنید.';
  return netMsg(e);
}

  ui.busy = true; ui.err = ''; render();
  try{
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'application/json'}, body: JSON.stringify({email, password:pw})});
    const d = await res.json();
    if(!res.ok) throw {bad:true};
    setSession(d); ui.busy = false; await loadOwner();
  }catch(e){
    ui.busy = false;
    ui.err = (e && e.bad) ? 'ایمیل یا رمز اشتباه است.' : 'ارتباط با سرور برقرار نشد.';

}

async function ensureCode(date){
  const used = new Set(Object.values(O.codes));
  for(let i = 0; i < 15; i++){
    const code = String(1000 + Math.floor(Math.random() * 9000));
    if(used.has(code)) continue;
    try{
      await sb('/rest/v1/day_codes', {method:'POST', auth:true, body:{date, code}, prefer:'return=minimal'});
      O.codes[date] = code; return;
    }catch(e){
      if(e && e.status === 409){
        used.add(code);
        const ex = await sb('/rest/v1/day_codes?date=eq.' + date + '&select=code', {auth:true});
        if(ex && ex.length){ O.codes[date] = ex[0].code; return; }
        continue;
      }
      throw e;
    }
  }
  throw {message:'ساخت کد ناموفق بود'};
}
async function addAvail(){
  const date = $('#a-date').value, from = $('#a-from').value, to = $('#a-to').value;
  ui.af = {date, from, to};
  if(!date || !from || !to){ ui.err = 'تاریخ و ساعت‌ها را کامل وارد کنید.'; render(); return; }
  if(date < todayStr()){ ui.err = 'تاریخ گذشته قابل انتخاب نیست.'; render(); return; }
  if(toMin(to) - toMin(from) < SLOT){ ui.err = 'بازه باید حداقل ' + faD(SLOT) + ' دقیقه باشد.'; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/avail', {method:'POST', auth:true, body:{date, from_time:from, to_time:to}, prefer:'return=minimal'});
    if(!O.codes[date]) await ensureCode(date);
    ui.busy = false; await loadOwner(); toast('اضافه شد');
  }catch(e){ ui.busy = false; ownerErr(e); render(); }
}
async function delRange(id){
  const r = O.avail.find(a => a.id === id); if(!r) return;
  const rest = O.avail.filter(a => a.id !== id && a.date === r.date).map(a => ({from:a.from_time, to:a.to_time}));
  const still = slotsFrom(rest);
  const orphan = O.bookings.filter(b => b.date === r.date && !still.includes(b.time));
  if(!confirm(orphan.length ? 'این بازه و ' + faD(orphan.length) + ' نوبت ثبت‌شده در آن حذف شود؟' : 'این بازه حذف شود؟')) return;
  try{
    await sb('/rest/v1/avail?id=eq.' + id, {method:'DELETE', auth:true});
    for(const b of orphan) await sb('/rest/v1/bookings?id=eq.' + b.id, {method:'DELETE', auth:true});
    if(!rest.length) await sb('/rest/v1/day_codes?date=eq.' + r.date, {method:'DELETE', auth:true});
    await loadOwner();
  }catch(e){ ownerErr(e); render(); }
}
async function delDay(d){
  const n = O.bookings.filter(b => b.date === d).length;
  if(!confirm(n ? 'این روز و ' + faD(n) + ' نوبت ثبت‌شده‌اش حذف شود؟' : 'این روز حذف شود؟')) return;
  try{
    await sb('/rest/v1/bookings?date=eq.' + d, {method:'DELETE', auth:true});
    await sb('/rest/v1/avail?date=eq.' + d, {method:'DELETE', auth:true});
    await sb('/rest/v1/day_codes?date=eq.' + d, {method:'DELETE', auth:true});
    await loadOwner();
  }catch(e){ ownerErr(e); render(); }
}

/* ---------- قرارداد و شرایط ---------- */
const SETTLE_TYPES = ['نقد', 'چک', 'باروک', 'سفته', 'برات'];
function blankTerms(){ return {settlement:[{type:'نقد', days:'', discount:''}], returns:{mode:'', percent:'', notes:''}, margins:[], extras:[], volumes:[], vip:{has:'', percent:''}}; }
let TE = blankTerms();
function normTerms(t){
  if(!t || typeof t !== 'object') return blankTerms();
  const v = x => x == null ? '' : x, arr = a => Array.isArray(a) ? a : [], rt = t.returns || {}, vp = t.vip || {};
  return {
    settlement: arr(t.settlement).map(r => ({type:v(r.type), days:v(r.days), discount:v(r.discount)})),
    returns: {mode:v(rt.mode), percent:v(rt.percent), notes:v(rt.notes)},
    margins: arr(t.margins).map(r => ({scope:v(r.scope), percent:v(r.percent)})),
    extras: arr(t.extras).map(r => ({scope:v(r.scope), kind:r.kind === 'plan' ? 'plan' : 'percent', value:v(r.value)})),
    volumes: arr(t.volumes).map(r => ({scope:v(r.scope), condition:v(r.condition), kind:r.kind === 'amount' ? 'amount' : 'percent', value:v(r.value)})),
    vip: {has:v(vp.has), percent:v(vp.percent)}
  };
}
const newRow = k => k === 'settlement' ? {type:'', days:'', discount:''} : k === 'margins' ? {scope:'', percent:''} :
  k === 'extras' ? {scope:'', kind:'percent', value:''} : {scope:'', condition:'', kind:'percent', value:''};
const num = x => { const n = parseFloat(enD(String(x == null ? '' : x)).replace(/٫/g, '.').replace(/,/g, '').trim()); return isFinite(n) ? n : null; };

function teHtml(){
  const t = TE;
  const I = (k, i, f, val, ph, mode, extra) => `<input data-k="${k}" data-i="${i}" data-f="${f}" value="${esc(val)}" placeholder="${esc(ph || '')}" ${mode ? 'inputmode="' + mode + '"' : ''} ${extra || ''} autocomplete="off">`;
  const S = (k, i, f, val, opts) => `<select data-k="${k}" data-i="${i}" data-f="${f}" onchange="teChange()">${opts.map(o => `<option value="${o[0]}" ${o[0] === val ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const D = (k, i) => `<button class="btn small ghost danger" onclick="teDel('${k}',${i})">حذف ردیف</button>`;
  const A = (k, label) => `<button class="btn small ghost" onclick="teAdd('${k}')">+ ${label}</button>`;

function cleanTerms(t){
  const s = x => String(x == null ? '' : x).trim();
  return {
    settlement: t.settlement.map(r => ({type:s(r.type), days:num(r.days), discount:num(r.discount)})).filter(r => r.type || r.days !== null || r.discount !== null),
    returns: {mode:t.returns.mode, percent:t.returns.mode === 'percent' ? num(t.returns.percent) : null, notes:s(t.returns.notes)},
    margins: t.margins.map(r => ({scope:s(r.scope), percent:num(r.percent)})).filter(r => r.scope || r.percent !== null),
    extras: t.extras.map(r => ({scope:s(r.scope), kind:r.kind, value:r.kind === 'percent' ? num(r.value) : s(r.value)})).filter(r => r.scope || (r.value !== null && r.value !== '')),
    volumes: t.volumes.map(r => ({scope:s(r.scope), condition:s(r.condition), kind:r.kind, value:r.kind === 'percent' ? num(r.value) : s(r.value)})).filter(r => r.scope || r.condition || (r.value !== null && r.value !== '')),
    vip: {has:t.vip.has, percent:t.vip.has === 'yes' ? num(t.vip.percent) : null}
  };
}
function validateTerms(c, partial){
  const pct = x => x !== null && x >= 0 && x <= 100;
  if(!partial && !c.settlement.length) return 'حداقل یک روش تسویه وارد کنید.';
  for(const r of c.settlement){
    if(!r.type) return 'نوع روش تسویه را وارد کنید (مثلاً نقد یا چک).';
    if(r.days !== null && (r.days < 0 || r.days > 365)) return 'مدت تسویه باید بین ۰ تا ۳۶۵ روز باشد.';
    if(r.discount !== null && !pct(r.discount)) return 'درصد تخفیف تسویه باید بین ۰ تا ۱۰۰ باشد.';
  }
  if(!partial && !c.returns.mode) return 'شرایط مرجوعی را انتخاب کنید.';
  if(c.returns.mode === 'percent' && !pct(c.returns.percent)) return 'درصد مرجوعی را (۰ تا ۱۰۰) وارد کنید.';
  for(const r of c.margins){ if(!r.scope || !pct(r.percent)) return 'برای هر مارژین، کالا یا گروه و درصد (۰ تا ۱۰۰) را وارد کنید.'; }
  for(const r of c.extras){
    if(!r.scope || r.value === '' || r.value === null) return 'برای هر تخفیف مازاد، کالا یا گروه و مقدار را وارد کنید.';
    if(r.kind === 'percent' && !pct(r.value)) return 'درصد تخفیف مازاد باید بین ۰ تا ۱۰۰ باشد.';
  }
  for(const r of c.volumes){
    if(!r.scope || !r.condition || r.value === '' || r.value === null) return 'برای هر تخفیف حجمی، کالا یا گروه، شرط حجم و مقدار را وارد کنید.';
    if(r.kind === 'percent' && !pct(r.value)) return 'درصد تخفیف حجمی باید بین ۰ تا ۱۰۰ باشد.';
  }
  if(!partial && !c.vip.has) return 'وضعیت VIP افق پلاس را انتخاب کنید.';
  if(c.vip.has === 'yes' && !pct(c.vip.percent)) return 'درصد VIP را (۰ تا ۱۰۰) وارد کنید.';
  return '';
}
function termsSummary(t){
  t = t || {};
  const li = x => `<li>${x}</li>`, p = x => faD(x) + '٪', L = a => a.length ? '<ul>' + a.join('') + '</ul>' : '<div class="muted">—</div>';
  const set = (t.settlement || []).map(r => li(`${esc(r.type)}${r.days ? ' ' + faD(r.days) + ' روزه' : ''}${r.discount ? ' — ' + p(r.discount) + ' تخفیف' : ''}`));
  const rt = t.returns || {};
  const ret = rt.mode === 'full' ? '۱۰۰٪ مرجوعی' : rt.mode === 'percent' ? p(rt.percent) + ' از مصرف' : rt.mode === 'none' ? 'ندارد' : '—';
  const mar = (t.margins || []).map(r => li(`${esc(r.scope)}: ${p(r.percent)}`));
  const ext = (t.extras || []).map(r => li(`${esc(r.scope)}: ${r.kind === 'plan' ? 'طرح فروش ویژه — ' + esc(r.value) : p(r.value)}`));
  const vol = (t.volumes || []).map(r => li(`${esc(r.scope)} — ${esc(r.condition)}: ${r.kind === 'amount' ? esc(faD(r.value)) + ' (مبلغ)' : p(r.value)}`));
  const vp = t.vip || {};
  const vip = vp.has === 'yes' ? 'دارد' + (vp.percent != null ? ' — ' + p(vp.percent) : '') : vp.has === 'no' ? 'ندارد' : '—';
  return `<div class="tsum"><b>تسویه</b>${L(set)}<b>مرجوعی</b><div>${ret}${rt.notes ? ' — ' + esc(rt.notes) : ''}</div><b>مارژین پایه</b>${L(mar)}<b>تخفیف مازاد</b>${L(ext)}<b>تخفیف حجمی</b>${L(vol)}<b>VIP افق پلاس</b><div>${vip}</div></div>`;
}

const invState = i => i.status === 'confirmed' ? 'confirmed' : i.status === 'cancelled' ? 'cancelled' :
  (i.status === 'sent' && new Date(i.expires_at) > new Date()) ? 'active' : 'expired';
const INV_LABEL = {active:'در انتظار ثبت', confirmed:'ثبت شد', cancelled:'لغو شده', expired:'منقضی'};
function freeSlots(date){
  const taken = new Set(O.bookings.filter(b => b.date === date).map(b => b.time));
  O.invites.filter(i => i.date === date && invState(i) === 'active').forEach(i => taken.add(i.time));
  const isToday = date === todayStr(), now = nowMin();
  return slotsFrom(ownerRanges(date)).filter(x => !taken.has(x) && !(isToday && toMin(x) <= now));
}

}

async function createInvite(){
  readInv(); const I = ui.inv, ph = normPhone(I.phone);
  if(!I.date || !I.time){ ui.err = 'روز و ساعت را انتخاب کنید.'; render(); return; }
  if(ph.length < 10){ ui.err = 'شماره موبایل معتبر نیست.'; render(); return; }
  const known = O.visitors.find(v => v.phone === ph);
  const name = I.name.trim() || (known ? known.name : '');
  ui.busy = true; ui.err = ''; render();
  try{
    const r = await sb('/rest/v1/rpc/create_invite', {method:'POST', auth:true, body:{p_date:I.date, p_time:I.time, p_phone:ph, p_name:name, p_hours:I.hours}});
    ui.busy = false; ui.inv = {date:I.date, time:'', phone:'', name:'', hours:I.hours};
    await loadOwner();
    const made = O.invites.find(x => x.code === r.code);
    ui.lastInv = made || {id:null, code:r.code, date:I.date, time:I.time, phone:ph, name};
    render();
  }catch(e){
    ui.busy = false;
    const m = (e && e.message) || '';
    if(m.indexOf('taken') > -1) ui.err = 'این زمان قبلاً رزرو شده یا برای کس دیگری نگه داشته شده است.';
    else if(m.indexOf('invalid_time') > -1) ui.err = 'این زمان خارج از بازه‌های تعریف‌شده است.';
    else if(m.indexOf('invalid_phone') > -1) ui.err = 'شماره موبایل معتبر نیست.';
    else ownerErr(e);
    render();
  }
}

    <div><label for="r-to">تا ساعت</label><input id="r-to" type="time" value="${esc(e.to_time)}"></div></div>
    ${errHtml()}${btn('ذخیره', 'saveRange()')}
    <div class="actions"><button class="btn small ghost" onclick="ui.editR=null;ui.err='';render()">انصراف</button></div></section>`;
}
function editRange(id){ const r = O.avail.find(a => a.id === id); if(!r) return; ui.editR = Object.assign({}, r); ui.err = ''; render(); }
async function saveRange(){
  const e = ui.editR, from = $('#r-from').value, to = $('#r-to').value;
  ui.editR = Object.assign({}, e, {from_time:from, to_time:to});
  if(!from || !to || toMin(to) - toMin(from) < SLOT){ ui.err = 'بازه باید حداقل ' + faD(SLOT) + ' دقیقه باشد.'; render(); return; }
  const others = O.avail.filter(a => a.id !== e.id && a.date === e.date).map(a => ({from:a.from_time, to:a.to_time}));
  const still = slotsFrom(others.concat([{from, to}]));
  const out = O.bookings.filter(b => b.date === e.date && !still.includes(b.time)).length;
  if(out && !confirm(faD(out) + ' نوبت ثبت‌شده بیرون از بازه جدید می‌افتد (حذف نمی‌شوند). ادامه می‌دهید؟')) return;
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/avail?id=eq.' + e.id, {method:'PATCH', auth:true, body:{from_time:from, to_time:to}, prefer:'return=minimal'});
    ui.busy = false; ui.editR = null; await loadOwner(); toast('ذخیره شد');
  }catch(er){ ui.busy = false; ownerErr(er); render(); }
}
async function editCode(d){
  const c = prompt('کد ۴ رقمی جدید برای این روز:', O.codes[d] || '');
  if(c === null) return;
  const code = enD(c).trim();
  if(!/^[0-9]{4}$/.test(code)){ ui.err = 'کد باید ۴ رقم باشد.'; render(); return; }
  try{ await sb('/rest/v1/day_codes?date=eq.' + d, {method:'PATCH', auth:true, body:{code}, prefer:'return=minimal'}); await loadOwner(); toast('کد تغییر کرد'); }
  catch(e){ if(e && e.status === 409) ui.err = 'این کد برای روز دیگری استفاده شده است.'; else ownerErr(e); render(); }
}

/* ---------- جدول ویزیتورها ---------- */
const visitCount = v => O.bookings.filter(b => normPhone(b.phone) === v.phone).length;
function filteredVisitors(){
  const q = enD(ui.q || '').trim().toLowerCase(), g = ui.gf || '';
  return O.visitors.filter(v => (!g || v.product_group === g) &&
    (!q || [v.company, v.name, v.phone, v.product_group, v.notes].join(' ').toLowerCase().indexOf(q) > -1));
}
function visitorsTable(){
  const list = filteredVisitors();
  if(!list.length) return `<p class="muted">${O.visitors.length ? 'موردی پیدا نشد.' : 'هنوز ویزیتوری ثبت نشده. با اولین نوبت‌گیری خودکار اضافه می‌شود.'}</p>`;
  return `<p class="muted">${faD(list.length)} ویزیتور</p><div class="tbl"><table><thead><tr>
    <th>شرکت</th><th>ویزیتور</th><th>موبایل</th><th>گروه کالا</th><th>قرارداد</th><th>ویزیت</th><th>توضیحات</th><th></th></tr></thead><tbody>` +
    list.map(v => `<tr><td><b>${esc(v.company)}</b></td><td>${esc(v.name)}</td>
      <td><a href="tel:${esc(v.phone)}">${esc(faD(v.phone))}</a></td><td>${esc(v.product_group)}</td>
      <td>${v.terms_done ? '✓' : '—'}</td><td>${faD(visitCount(v))}</td><td class="nt">${esc(v.notes)}</td>
      <td><button class="btn small ghost" onclick="editVisitor('${v.id}')">ویرایش</button></td></tr>`).join('') + `</tbody></table></div>`;
}
function filterV(){ ui.q = $('#vq').value; ui.gf = $('#vg').value; $('#vt').innerHTML = visitorsTable(); }
function visitorsTab(){
  if(ui.edit) return visitorForm();
  const groups = [...new Set(O.visitors.map(v => v.product_group).filter(Boolean))].sort();
  return `${errHtml()}<section class="card">
    <input id="vq" placeholder="جستجو: شرکت، نام، موبایل…" value="${esc(ui.q)}" oninput="filterV()" aria-label="جستجو">
    <select id="vg" onchange="filterV()" style="margin-top:8px" aria-label="فیلتر گروه">
      <option value="">همه گروه‌ها</option>${groups.map(g => `<option value="${esc(g)}" ${g === ui.gf ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
    <div class="actions"><button class="btn small" onclick="newVisitor()">افزودن ویزیتور</button>
      <button class="btn small ghost" onclick="copyVisitors()">کپی جدول (اکسل)</button></div></section>
    <div id="vt">${visitorsTable()}</div>`;
}
function visitorForm(){
  const e = ui.edit;
  return `<section class="card"><h3>${e.id ? 'ویرایش ویزیتور' : 'ویزیتور جدید'}</h3>
    <label for="e-company">نام شرکت</label><input id="e-company" value="${esc(e.company)}">
    <label for="e-name">نام ویزیتور</label><input id="e-name" value="${esc(e.name)}">
    <label for="e-phone">شماره تماس</label><input id="e-phone" inputmode="tel" value="${esc(e.phone)}">
    <label for="e-group">گروه کالایی</label><input id="e-group" list="grp" autocomplete="off" value="${esc(e.product_group)}">
    <datalist id="grp" class="grp">${groupOpts()}</datalist>
    <label for="e-notes">توضیحات</label><textarea id="e-notes" rows="4">${esc(e.notes)}</textarea>
    <h3 style="margin-top:18px">قرارداد و شرایط همکاری</h3>
    <div id="tedit">${teHtml()}</div>
    ${errHtml()}${btn('ذخیره', 'saveVisitor()')}
    <div class="actions"><button class="btn small ghost" onclick="ui.edit=null;ui.err='';render()">انصراف</button>
      ${e.id ? `<button class="btn small ghost danger" onclick="delVisitor('${e.id}')">حذف</button>` : ''}</div></section>`;
}
function newVisitor(){ ui.edit = {id:null, company:'', name:'', phone:'', product_group:'', notes:''}; TE = blankTerms(); ui.err = ''; render(); }
function editVisitor(id){ const v = O.visitors.find(x => x.id === id); if(!v) return; ui.edit = Object.assign({}, v); TE = normTerms(v.terms); ui.err = ''; render(); }
async function saveVisitor(){
  const e = ui.edit;
  const f = {company:$('#e-company').value.trim(), name:$('#e-name').value.trim(), phone:normPhone($('#e-phone').value),
    product_group:$('#e-group').value.trim(), notes:$('#e-notes').value.trim()};
  ui.edit = Object.assign({}, e, f);
  if(!f.company || !f.name){ ui.err = 'نام شرکت و نام ویزیتور الزامی است.'; render(); return; }
  if(!/^[0-9]{10,15}$/.test(f.phone)){ ui.err = 'شماره تماس معتبر نیست.'; render(); return; }
  teSync(); const tc = cleanTerms(TE);
  const tEmpty = !tc.settlement.length && !tc.returns.mode && !tc.margins.length && !tc.extras.length && !tc.volumes.length && !tc.vip.has;
  const tErr = tEmpty ? '' : validateTerms(tc, true);
  if(tErr){ ui.err = tErr; render(); return; }
  f.terms = tEmpty ? null : tc; f.terms_done = !tEmpty && validateTerms(tc, false) === ''; f.terms_updated_at = tEmpty ? null : new Date().toISOString();
  ui.busy = true; ui.err = ''; render();
  try{
    if(e.id) await sb('/rest/v1/visitors?id=eq.' + e.id, {method:'PATCH', auth:true, body:f, prefer:'return=minimal'});
    else await sb('/rest/v1/visitors', {method:'POST', auth:true, body:f, prefer:'return=minimal'});
    ui.busy = false; ui.edit = null; await loadOwner(); toast('ذخیره شد');
  }catch(er){
    ui.busy = false;
    if(er && er.status === 409) ui.err = 'این شماره قبلاً برای ویزیتور دیگری ثبت شده است.'; else ownerErr(er);
    render();
  }
}
async function delVisitor(id){
  if(!confirm('این ویزیتور از جدول حذف شود؟ نوبت‌های قبلی او باقی می‌ماند.')) return;
  try{ await sb('/rest/v1/visitors?id=eq.' + id, {method:'DELETE', auth:true}); ui.edit = null; await loadOwner(); }
  catch(e){ ownerErr(e); render(); }
}
function copyVisitors(){
  const c = x => String(x == null ? '' : x).replace(/[\t\r\n]+/g, ' ');
  const rows = [['شرکت','ویزیتور','موبایل','گروه کالایی','قرارداد','تعداد ویزیت','توضیحات']].concat(
    filteredVisitors().map(v => [v.company, v.name, v.phone, v.product_group, v.terms_done ? 'ثبت‌شده' : '—', visitCount(v), v.notes]));
  copyText(rows.map(r => r.map(c).join('\t')).join('\n'));
}

function settingsTab(){
  return `<section class="card"><h3>توضیح دوره ویزیت ماهانه</h3>
      <p class="muted">این متن به ویزیتورها نشان داده می‌شود. اگر خالی بگذارید نمایش داده نمی‌شود.</p>
      <textarea id="cn" rows="5">${esc(cycleNote())}</textarea>
      ${errHtml()}${btn('ذخیره توضیح', 'saveCycle()')}</section>
    <section class="card"><h3>گروه‌های کالایی</h3>
      <p class="muted">هر گروه در یک خط. این‌ها به‌صورت پیشنهاد در فرم ویزیتور نمایش داده می‌شوند.</p>
      <textarea id="gl" rows="5">${esc(GROUPS.join('\n'))}</textarea>
      ${btn('ذخیره گروه‌ها', 'saveGroups()')}</section>
    <section class="card"><h3>تغییر رمز</h3>
      <label for="np">رمز جدید (حداقل ۶ حرف)</label><input id="np" type="password" dir="ltr" autocomplete="new-password">
      ${btn('ذخیره رمز', 'changePw()')}</section>
    <button class="btn ghost block" onclick="logout()">خروج از بخش مدیر</button>`;
}
async function saveCycle(){
  const value = $('#cn').value.trim();
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/settings?on_conflict=key', {method:'POST', auth:true, body:{key:'cycle_note', value}, prefer:'resolution=merge-duplicates,return=minimal'});
    CYCLE = value; ui.busy = false; render(); toast('ذخیره شد');
  }catch(e){ ui.busy = false; ownerErr(e); render(); }
}
async function saveGroups(){
  const value = parseGroups($('#gl').value).join('\n');
  ui.busy = true; ui.err = ''; render();
  try{
    await sb('/rest/v1/settings?on_conflict=key', {method:'POST', auth:true, body:{key:'product_groups', value}, prefer:'resolution=merge-duplicates,return=minimal'});
    GROUPS = parseGroups(value); ui.busy = false; render(); toast('ذخیره شد');
  }catch(e){ ui.busy = false; ownerErr(e); render(); }
}
async function changePw(){
  const p = $('#np').value;
  if(p.length < 6){ ui.err = 'رمز باید حداقل ۶ حرف باشد.'; render(); return; }
  ui.busy = true; ui.err = ''; render();
  try{ await sb('/auth/v1/user', {method:'PUT', auth:true, body:{password:p}}); ui.busy = false; render(); toast('رمز تغییر کرد'); }
  catch(e){ ui.busy = false; ownerErr(e); render(); }
}

render();
loadCycle();
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
